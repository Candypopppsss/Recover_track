name: Validate RecoverTrack
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/intelligence/requirements.txt
            services/intelligence/requirements-dev.txt
      - name: Install OCR system dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - name: Install locked Node dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Python test dependencies
        run: python -m pip install --requirement services/intelligence/requirements-dev.txt
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run API and schedule tests
        run: npm test
      - name: Run intelligence tests
        env:
          OMP_THREAD_LIMIT: "1"
        run: python -m unittest discover -s services/intelligence -p 'test_*.py'
      - name: Build frontend
        run: npm run build
      - name: Check publication files and browser assets for secrets
        run: npm run check:secrets
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Exercise browser workflows
        run: npm run test:e2e
      - name: Save browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7

  mongodb-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 127.0.0.1:27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked Node dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify encrypted MongoDB persistence and access rules
        env:
          RECOVERTRACK_TEST_MONGODB_URI: mongodb://127.0.0.1:27017
        run: npm run test:mongo

  postgresql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked Node dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify encrypted PostgreSQL transactions, persistence and access rules
        env:
          RECOVERTRACK_TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: npm run test:postgres
